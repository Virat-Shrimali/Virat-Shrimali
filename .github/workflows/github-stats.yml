name: Update GitHub Stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=radical&bg_color=0d1117&title_color=00ffcc&text_color=ffffff&icon_color=00ffcc&border_color=30363d&border_radius=10
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&theme=radical&bg_color=0d1117&title_color=00ffcc&text_color=ffffff&border_color=30363d&border_radius=10
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch profile repository views
        env:
          GH_TOKEN: ${{ secrets.PROFILE_VIEWS_TOKEN }}
        run: |
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${{ github.repository }}/traffic/views?per=day" \
            -o /tmp/views.json

      - name: Update profile view history
        run: |
          python <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          traffic = json.loads(Path("/tmp/views.json").read_text())
          data_file = Path("profile/views.json")

          if data_file.exists():
              data = json.loads(data_file.read_text())
          else:
              data = {"days": {}}

          for item in traffic.get("views", []):
              date = item["timestamp"][:10]
              data["days"][date] = item["count"]

          data["total_views"] = sum(data["days"].values())
          data["updated_at"] = datetime.now(timezone.utc).isoformat()

          data_file.parent.mkdir(parents=True, exist_ok=True)
          data_file.write_text(json.dumps(data, indent=2) + "\n")

          print(f"Profile repository views: {data['total_views']}")
          PY

      - name: Generate profile views badge
        run: |
          python <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("profile/views.json").read_text())
          views = data["total_views"]

          if views >= 1_000_000:
              display = f"{views / 1_000_000:.1f}M"
          elif views >= 1_000:
              display = f"{views / 1_000:.1f}K"
          else:
              display = str(views)

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="190" height="35" viewBox="0 0 190 35">
          <rect width="190" height="35" rx="8" fill="#0d1117" stroke="#30363d"/>
          <text x="15" y="23" font-family="Arial, sans-serif" font-size="14" fill="#ffffff">Profile Views</text>
          <text x="175" y="23" text-anchor="end" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#00ffcc">{display}</text>
          </svg>
          '''

          Path("profile/views.svg").write_text(svg)
          PY

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg profile/top-langs.svg profile/views.svg profile/views.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update GitHub stats and profile views"
          git push
